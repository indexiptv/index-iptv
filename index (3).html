<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-tag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index IPTV | Premium Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --p-accent: #0088cc; /* لون التليغرام */
            --p-glow: rgba(0, 136, 204, 0.4);
            --bg-deep: #050505;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-dim: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.25s ease; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* صورة الخلفية العلوية */
        .hero-banner {
            width: 100%;
            height: 220px;
            background: linear-gradient(to bottom, transparent, var(--bg-deep)), 
                        url('https://i.supaimg.com/4e85eea0-d1a8-47b6-9658-56c0c7744dc8.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .container { width: 100%; max-width: 500px; padding: 0 20px 40px; margin-top: -60px; z-index: 2; }

        /* حقوق التليغرام */
        .tg-badge {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background: rgba(0, 136, 204, 0.15); border: 1px solid rgba(0, 136, 204, 0.3);
            padding: 10px; border-radius: 12px; text-decoration: none; color: #0088cc;
            font-weight: 600; font-size: 14px; margin-bottom: 25px;
        }
        .tg-badge:hover { background: rgba(0, 136, 204, 0.25); transform: translateY(-2px); }

        /* محول اللغات */
        .lang-switcher {
            display: flex; gap: 5px; background: rgba(255,255,255,0.05); 
            padding: 4px; border-radius: 10px; margin-bottom: 20px;
        }
        .lang-btn {
            flex: 1; padding: 6px; border: none; background: transparent;
            color: var(--text-dim); cursor: pointer; font-size: 11px; font-weight: 600; border-radius: 7px;
        }
        .lang-btn.active { background: var(--p-accent); color: white; }

        /* البطاقات */
        .glass-card {
            background: rgba(15, 15, 15, 0.8); backdrop-filter: blur(15px);
            border: 1px solid var(--card-border); border-radius: 20px;
            padding: 20px; margin-bottom: 15px;
        }

        header { text-align: center; margin-bottom: 25px; }
        .logo { font-family: 'Syne', sans-serif; font-size: 32px; font-weight: 800; }
        .logo span { color: var(--p-accent); }

        .label-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 11px; color: var(--text-dim); }
        
        input {
            width: 100%; padding: 14px; background: rgba(255,255,255,0.03);
            border: 1px solid var(--card-border); border-radius: 12px;
            color: white; font-size: 14px; outline: none; text-align: left;
        }
        input:focus { border-color: var(--p-accent); background: rgba(0, 136, 204, 0.05); }

        .main-btn {
            width: 100%; padding: 18px; border-radius: 14px; border: none;
            background: var(--p-accent); color: white; font-weight: 800; font-size: 16px;
            cursor: pointer; box-shadow: 0 8px 20px var(--p-glow); margin-bottom: 20px;
        }
        .main-btn:hover { filter: brightness(1.2); transform: translateY(-2px); }

        .result-box {
            background: #000; border-radius: 15px; padding: 15px;
            border: 1px solid var(--card-border); display: none;
        }
        .result-box.active { display: block; animation: fadeIn 0.5s ease; }
        #output { font-family: monospace; font-size: 12px; color: #7dd3fc; word-break: break-all; margin-bottom: 15px; }

        .copy-btn {
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--card-border);
            color: white; padding: 10px; border-radius: 10px; cursor: pointer; font-size: 13px;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        footer { font-size: 10px; color: #475569; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>

<div class="hero-banner"></div>

<div class="container">
    <header>
        <div class="logo">INDEX <span>IPTV</span></div>
        <div id="t-subtitle" style="font-size: 13px; color: var(--text-dim);">أداة توليد الروابط الاحترافية</div>
    </header>

    <a href="https://t.me/indexiptv" target="_blank" class="tg-badge">
        <span>✈️ Telegram @indexiptv</span>
    </a>

    <div class="lang-switcher">
        <button class="lang-btn active" onclick="setLang('ar')">العربية</button>
        <button class="lang-btn" onclick="setLang('en')">English</button>
        <button class="lang-btn" onclick="setLang('fr')">Français</button>
    </div>

    <div class="glass-card">
        <div class="label-row"><span id="t-portal">Portal URL</span> <span style="color:var(--p-accent)">*</span></div>
        <input type="url" id="portal" placeholder="http://server.com:8080">
        
        <div style="height:15px"></div>

        <div class="label-row"><span id="t-mac">MAC Address</span> <span style="color:var(--p-accent)">*</span></div>
        <input type="text" id="mac" placeholder="00:1A:79:XX:XX:XX">
    </div>

    <button class="main-btn" onclick="generate()" id="t-btn-gen">⚡ توليد الرابط</button>

    <div class="result-box" id="res-box">
        <div id="output"></div>
        <button class="copy-btn" onclick="copyUrl()" id="t-btn-copy">📋 نسخ الرابط</button>
    </div>

    <footer>
        © 2026 INDEX IPTV TOOLS<br>
        Powered by Index Community
    </footer>
</div>

<script>
    const translations = {
        ar: { subtitle: "أداة توليد الروابط الاحترافية", portal: "رابط البورتال", mac: "عنوان الماك", btnGen: "⚡ توليد الرابط", btnCopy: "📋 نسخ الرابط", dir: "rtl" },
        en: { subtitle: "Professional Link Generator", portal: "Portal URL", mac: "MAC Address", btnGen: "⚡ Generate Link", btnCopy: "📋 Copy Link", dir: "ltr" },
        fr: { subtitle: "Générateur de liens Pro", portal: "URL du Portail", mac: "Adresse MAC", btnGen: "⚡ Générer le lien", btnCopy: "📋 Copier le lien", dir: "ltr" }
    };

    function setLang(lang) {
        const t = translations[lang];
        document.getElementById('html-tag').dir = t.dir;
        document.getElementById('t-subtitle').innerText = t.subtitle;
        document.getElementById('t-portal').innerText = t.portal;
        document.getElementById('t-mac').innerText = t.mac;
        document.getElementById('t-btn-gen').innerText = t.btnGen;
        document.getElementById('t-btn-copy').innerText = t.btnCopy;
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
    }

    let finalUrl = "";

    function generate() {
        const p = document.getElementById('portal').value.trim();
        const m = document.getElementById('mac').value.trim();
        if(!p || !m) return alert("Fill fields / أكمل البيانات");

        finalUrl = window.location.origin + "/playlist.m3u?portal=" + encodeURIComponent(p) + "&mac=" + encodeURIComponent(m);
        document.getElementById('output').innerText = finalUrl;
        document.getElementById('res-box').classList.add('active');
    }

    function copyUrl() {
        navigator.clipboard.writeText(finalUrl);
        alert("✅ Copied / تم النسخ");
    }
</script>

</body>
</html>
