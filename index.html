<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-tag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index IPTV | Premium Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --p-accent: #0088cc;
            --bg-deep: #050505;
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-dim: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.25s ease; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-deep); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .hero-banner { width: 100%; height: 200px; background: linear-gradient(to bottom, transparent, var(--bg-deep)), url('https://i.supaimg.com/4e85eea0-d1a8-47b6-9658-56c0c7744dc8.jpg'); background-size: cover; background-position: center; }
        .container { width: 100%; max-width: 450px; padding: 20px; margin-top: -50px; }
        .glass-card { background: rgba(15, 15, 15, 0.9); backdrop-filter: blur(10px); border: 1px solid var(--card-border); border-radius: 20px; padding: 25px; margin-bottom: 20px; }
        header { text-align: center; margin-bottom: 20px; }
        .logo { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; }
        .logo span { color: var(--p-accent); }
        input { width: 100%; padding: 15px; background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); border-radius: 12px; color: white; margin-bottom: 15px; outline: none; }
        input:focus { border-color: var(--p-accent); }
        .main-btn { width: 100%; padding: 18px; border-radius: 12px; border: none; background: var(--p-accent); color: white; font-weight: bold; cursor: pointer; font-size: 16px; }
        .result-box { background: #000; border-radius: 15px; padding: 15px; margin-top: 20px; border: 1px solid var(--card-border); display: none; }
        .result-box.active { display: block; }
        #output { font-family: monospace; font-size: 11px; color: #7dd3fc; word-break: break-all; margin-bottom: 10px; }
        .copy-btn { width: 100%; background: #1e293b; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="hero-banner"></div>
    <div class="container">
        <header><div class="logo">INDEX <span>IPTV</span></div></header>
        <div class="glass-card">
            <input type="url" id="portal" placeholder="رابط البورتال (مثال: http://site.com:8080)">
            <input type="text" id="mac" placeholder="عنوان الماك (00:1A:79:XX:XX:XX)">
            <button class="main-btn" onclick="generate()">⚡ توليد الرابط الشغال</button>
        </div>
        <div class="result-box" id="res-box">
            <div id="output"></div>
            <button class="copy-btn" onclick="copyUrl()">📋 نسخ الرابط</button>
        </div>
    </div>

    <script>
        let finalUrl = "";
        function generate() {
            const p = document.getElementById('portal').value.trim();
            const m = document.getElementById('mac').value.trim();
            if(!p || !m) return alert("أدخل البيانات");
            
            // رابط الـ Worker الخاص بك
            const workerUrl = "https://iptv-backend.indexiptv212.workers.dev";
            finalUrl = `${workerUrl}/?portal=${encodeURIComponent(p)}&mac=${encodeURIComponent(m)}`;
            
            document.getElementById('output').innerText = finalUrl;
            document.getElementById('res-box').classList.add('active');
        }
        function copyUrl() {
            navigator.clipboard.writeText(finalUrl);
            alert("تم النسخ!");
        }
    </script>
</body>
</html>
